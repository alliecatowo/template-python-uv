[project]
name = "template-python-uv"
version = "0.1.0"
description = "Python package template: uv, pytest, ruff, PyPI trusted publishing, mise, lefthook, CI and a VitePress docs site."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Allison Coleman" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/alliecatowo/template-python-uv"
Issues = "https://github.com/alliecatowo/template-python-uv/issues"

[project.scripts]
template-python-uv = "template_python_uv.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "template_python_uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
