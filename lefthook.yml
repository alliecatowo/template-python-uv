pre-commit:
  commands:
    ruff-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    ruff-check:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true

commit-msg:
  skip: [merge, rebase]
  commands:
    conventional-commit:
      run: |
        head -1 "{1}" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' || {
          echo "commit subject must be a conventional commit, e.g. 'feat(scope): add thing'" >&2
          exit 1
        }
